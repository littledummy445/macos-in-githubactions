name: Interactive macOS In-Browser Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure macOS VNC Settings
        run: |
          # 1. Create VNCSettings plist using Python
          sudo python3 -c '
          import plistlib
          plist_path = "/Library/Preferences/com.apple.VNCSettings.plist"
          data = {"VNCPassword": bytes.fromhex("f2c1292021d120a2")}
          with open(plist_path, "wb") as f:
              plistlib.dump(data, f)
          '

          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.plist

          # 2. Activate Screen Sharing with valid kickstart flags
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -restart -agent -console || true

      - name: Setup noVNC Web Interface
        run: |
          pip3 install numpy --break-system-packages
          git clone https://github.com/novnc/noVNC.git ~/noVNC
          git clone https://github.com/novnc/websockify.git ~/noVNC/utils/websockify
          
          # Start noVNC proxy on port 6080
          ~/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 > novnc.log 2>&1 &
          sleep 3

      - name: Start HTTPS Cloudflare Tunnel
        run: |
          # Install official cloudflared via Homebrew to avoid redirect issues
          brew install cloudflared

          # Start tunnel for local noVNC port 6080
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &
          sleep 8

          echo "=========================================="
          echo " IN-BROWSER MACOS DESKTOP CONNECTION "
          echo "=========================================="
          echo "VNC Password: secret123"
          echo "Your HTTPS Connection URL:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log || cat cloudflare.log
          echo "=========================================="

      - name: Keep Runner Alive for 1 Hour
        run: |
          echo "Desktop live! Auto-shutdown in 60 minutes."
          sleep 3600
