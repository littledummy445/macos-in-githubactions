name: Interactive macOS VNC Session

on:
  workflow_dispatch: # Trigger manually from the Actions tab

jobs:
  mac-vnc-session:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Screen Sharing & Set VNC Password
        run: |
          # 1. Change password for the built-in 'runner' user to 'secret123'
          sudo sysadminctl -adminUser runner -adminPassword "" -resetPasswordFor runner -newPassword secret123

          # 2. Enable VNC Legacy Password / Apple Remote Desktop
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientconfigure -instances -users runner \
            -access -on -privs -all \
            -restart -agent -console

      - name: Start Free TCP Tunnel (Pinggy)
        run: |
          # Create a background SSH tunnel to Pinggy for port 5900 (VNC)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:5900 a.pinggy.io > pinggy.log 2>&1 &
          
          # Wait 5 seconds for the tunnel to establish
          sleep 5

          # Print the connection endpoint
          echo "=========================================="
          echo " VNC DESKTOP CONNECTION DETAILS "
          echo "=========================================="
          echo "Username: runner"
          echo "Password: secret123"
          echo "Connection Address (Look for TCP address below):"
          cat pinggy.log | grep -E "tcp://|a.pinggy.io" || cat pinggy.log
          echo "=========================================="

      - name: Keep Runner Alive for 1 Hour
        run: |
          echo "VNC session successfully started! Shutting down in 60 minutes."
          sleep 3600
          echo "1 hour reached. Destroying runner..."
