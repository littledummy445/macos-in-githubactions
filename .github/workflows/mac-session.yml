name: Interactive macOS RDP Session

on:
  workflow_dispatch:

jobs:
  mac-rdp-session:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RDP Server & Set Password
        run: |
          # 1. Change password for 'runner' user to 'secret123'
          sudo sysadminctl -adminUser runner -adminPassword "" -resetPasswordFor runner -newPassword secret123

          # 2. Install xrdp via Homebrew
          brew install xrdp

          # 3. Start XRDP Service
          sudo xrdp

      - name: Start TCP Tunnel for RDP (Port 3389)
        run: |
          # Download bore
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-apple-darwin.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

          # Point bore tunnel to standard Windows RDP port (3389)
          bore local 3389 --to bore.pub > bore.log 2>&1 &
          sleep 5

          echo "=========================================="
          echo " WINDOWS RDP CONNECTION DETAILS "
          echo "=========================================="
          echo "Username: runner"
          echo "Password: secret123"
          echo "RDP Address:"
          cat bore.log
          echo "=========================================="

      - name: Keep Runner Alive for 1 Hour
        run: |
          sleep 3600
