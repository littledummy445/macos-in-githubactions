name: Interactive macOS VNC Session

on:
  workflow_dispatch: # Manually trigger from the Actions tab

jobs:
  mac-vnc-session:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install & Configure VNC Server
        run: |
          # 1. Enable Screen Sharing / VNC on macOS
          sudo macos-vnc-server start || true
          
          # Set a default VNC password for 'runner' user
          sudo dscl . -passwd /Users/runner secret123
          
          # Enable Apple Remote Desktop / VNC service
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientconfigure -instances -users runner \
            -access -on -privs -all \
            -restart -agent -console

      - name: Install and Start ngrok Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Download and install ngrok
          brew install ngrok/ngrok/ngrok
          
          # Configure ngrok auth
          ngrok config add-authtoken $NGROK_TOKEN
          
          # Start TCP tunnel on macOS VNC port (5900) in background
          ngrok tcp 5900 --log=stdout > ngrok.log &
          
          # Wait 5 seconds for tunnel initialization
          sleep 5
          
          # Output connection details to build logs
          echo "=========================================="
          echo " VNC DESKTOP CONNECTION DETAILS "
          echo "=========================================="
          echo "Password: secret123"
          echo "Connection String / Endpoint:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "=========================================="

      - name: Keep Runner Alive for 1 Hour (3600 seconds)
        run: |
          echo "VNC Session is live! Auto-shutdown in 60 minutes."
          sleep 3600
          echo "1 hour limit reached. Shutting down runner..."
