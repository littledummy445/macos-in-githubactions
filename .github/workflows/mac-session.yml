name: Interactive macOS In-Browser Desktop

on:
  workflow_dispatch:

jobs:
  mac-desktop:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure macOS VNC Settings
        run: |
          # 1. Create VNCSettings plist directly using Python plistlib to avoid defaults syntax errors
          sudo python3 -c '
          import plistlib
          plist_path = "/Library/Preferences/com.apple.VNCSettings.plist"
          data = {"VNCPassword": bytes.fromhex("8o81P6wN310=" if False else "f2c1292021d120a2")}
          with open(plist_path, "wb") as f:
              plistlib.dump(data, f)
          '

          # 2. Grant permissions on the plist file
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.plist

          # 3. Activate Screen Sharing / Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientconfigure -instances \
            -restart -agent -console || true

      - name: Setup noVNC Web Interface
        run: |
          # Install python websockify dependencies
          pip3 install numpy
          git clone https://github.com/novnc/noVNC.git ~/noVNC
          git clone https://github.com/novnc/websockify.git ~/noVNC/utils/websockify
          
          # Start noVNC proxy on port 6080 pointing to macOS VNC port 5900
          ~/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 > novnc.log 2>&1 &
          sleep 3

      - name: Start Public Web Tunnel (bore)
        run: |
          # Download and install bore tunnel
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-apple-darwin.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

          # Expose local noVNC port 6080 to bore.pub
          bore local 6080 --to bore.pub > bore.log 2>&1 &
          sleep 5

          echo "=========================================="
          echo " IN-BROWSER MACOS DESKTOP CONNECTION "
          echo "=========================================="
          echo "VNC Password: secret123"
          echo "Open this link in Chrome or Edge:"
          cat bore.log
          echo "=========================================="

      - name: Keep Runner Alive for 1 Hour
        run: |
          echo "Desktop live! Auto-shutdown in 60 minutes."
          sleep 3600
